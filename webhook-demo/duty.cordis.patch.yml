# 叠在 web profile 之上：默认模型换成脚本化的 scripted/mock，挂上值班插件。
- id: agent-default-model
  config:
    provider: scripted
    model: mock

- insert:
    - id: duty-demo
      name: './duty-plugin.ts'
      config:
        probeFile: !!js process.env.DUTY_PROBE_FILE
        controlDir: !!js process.env.DUTY_CONTROL_DIR
